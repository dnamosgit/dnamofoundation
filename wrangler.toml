# Cloudflare Pages project: the public site, the admin center and its database.
name = "dnamo-foundation"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Database for admin accounts, sessions and editable site content.
# database_id is the database in the Cloudflare account (an identifier, not a secret).
[[d1_databases]]
binding = "DB"
database_name = "dnamo-admin"
database_id = "c6520aff-756d-447f-b9f2-f34aa0c5e778"
migrations_dir = "migrations"
